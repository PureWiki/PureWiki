# This GitHub Action checks the local PHP dependencies 
# defined in '.dev/dependencies.json' against the latest available releases on GitHub.
# It compares the local versions with the latest available releases.
# Fails the workflow if any updates are found.

name: Check PHP Dependencies for Updates

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: 

jobs:
  check-updates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check for PHP Library Updates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILE=".dev/dependencies.json"
          
          if [ ! -f "$FILE" ]; then
            echo "::error::File $FILE not found!"
            exit 1
          fi
          
          echo "Checking PHP dependencies in $FILE..."
          
          UPDATE_FOUND=0
          
          while read repo local_version; do
            
            latest_release=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" "https://api.github.com/repos/$repo/releases/latest" | jq -r '.tag_name')
            
            if [ "$latest_release" == "null" ] || [ -z "$latest_release" ]; then
              latest_release=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" "https://api.github.com/repos/$repo/tags" | jq -r '.[0].name')
            fi
            
            clean_latest=${latest_release#v}
            clean_local=${local_version#v}
            
            if [ "$latest_release" == "null" ] || [ -z "$latest_release" ]; then
              echo "::warning::Could not find any version for $repo on GitHub."
            elif [ "$clean_latest" != "$clean_local" ]; then
              echo "::error::UPDATE AVAILABLE: $repo | Local: $local_version -> New: $latest_release"
              UPDATE_FOUND=1
            else
              echo "Up to date: $repo ($local_version)"
            fi
            
          done < <(jq -r '.php | to_entries | .[] | "\(.key) \(.value)"' "$FILE")
          
          if [ $UPDATE_FOUND -eq 1 ]; then
            echo "::error::Workflow failed because one or more updates are available."
            exit 1
          fi